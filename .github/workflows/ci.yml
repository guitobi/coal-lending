name: CI - Build and Test

on:
  push:
    branches:
      - main
      - prod
      - develop
  pull_request:
    branches:
      - main
      - prod
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # CLIENT CHECKS
  # ============================================
  client-lint:
    name: Client - Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

  client-build:
    name: Client - Build
    runs-on: ubuntu-latest
    needs: client-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://coal-lending-backend.fly.dev
          VITE_SITE_URL: https://vanshare.pl
          VITE_GA_MEASUREMENT_ID: G-TY2RQHRFWQ

      - name: Check bundle size
        working-directory: client
        run: npm run perf-budget
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

  client-type-check:
    name: Client - Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Check for TypeScript files
        id: check-ts
        working-directory: client
        run: |
          if find src -name "*.ts" -o -name "*.tsx" | grep -q .; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
          fi

      - name: Run type check
        if: steps.check-ts.outputs.has_typescript == 'true'
        working-directory: client
        run: npx tsc --noEmit || echo "No TypeScript configuration found"

  # ============================================
  # SERVER CHECKS
  # ============================================
  server-lint:
    name: Server - Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check for ESLint config
        id: check-eslint
        working-directory: server
        run: |
          if [ -f "eslint.config.js" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ]; then
            echo "has_eslint=true" >> $GITHUB_OUTPUT
          else
            echo "has_eslint=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ESLint
        if: steps.check-eslint.outputs.has_eslint == 'true'
        working-directory: server
        run: npm run lint || echo "No lint script found"

  server-test:
    name: Server - Test
    runs-on: ubuntu-latest
    needs: server-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test || echo "No tests configured yet"
        continue-on-error: true

  server-build:
    name: Server - Build Check
    runs-on: ubuntu-latest
    needs: server-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --omit=dev

      - name: Verify server starts
        working-directory: server
        run: |
          timeout 10s node src/index.js || exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Server started successfully (timed out as expected)"
            exit 0
          elif [ $exit_code -eq 0 ]; then
            echo "Server started and stopped cleanly"
            exit 0
          else
            echo "Server failed to start with exit code $exit_code"
            exit 1
          fi
        env:
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          ALLOWED_ORIGINS: http://localhost:5173
          RESEND_API_KEY: test_key
          MAIL_FROM: test@example.com
          EMAIL_TO: test@example.com
          CONTACT_EMAIL_TO: test@example.com
          ADMIN_API_KEY: test_admin_key

  # ============================================
  # DOCKER BUILD
  # ============================================
  docker-build:
    name: Docker - Build Server Image
    runs-on: ubuntu-latest
    needs: [server-lint, server-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: server
        run: |
          docker build -t coal-lending-server:${{ github.sha }} .
          docker images

      - name: Test Docker image
        run: |
          docker run -d --name test-server \
            -e NODE_ENV=test \
            -e PORT=5000 \
            -e FRONTEND_URL=http://localhost:5173 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e RESEND_API_KEY=test_key \
            -e MAIL_FROM=test@example.com \
            -e EMAIL_TO=test@example.com \
            -e CONTACT_EMAIL_TO=test@example.com \
            -e ADMIN_API_KEY=test_admin_key \
            -p 5000:5000 \
            coal-lending-server:${{ github.sha }}

          sleep 5

          # Check if container is running
          if docker ps | grep test-server; then
            echo "Container is running"
          else
            echo "Container failed to start"
            docker logs test-server
            exit 1
          fi

          # Test health endpoint
          curl -f http://localhost:5000/health || exit 1

          docker stop test-server
          docker rm test-server

  # ============================================
  # SECURITY CHECKS
  # ============================================
  security-audit:
    name: Security - Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # ============================================
  # SUMMARY
  # ============================================
  ci-success:
    name: CI - All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - client-lint
      - client-build
      - client-type-check
      - server-lint
      - server-test
      - server-build
      - docker-build
      - security-audit
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.client-lint.result }}" != "success" ] || \
             [ "${{ needs.client-build.result }}" != "success" ] || \
             [ "${{ needs.server-lint.result }}" != "success" ] || \
             [ "${{ needs.server-build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "Some CI checks failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"

      - name: Post summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client lint: ${{ needs.client-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client build: ${{ needs.client-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client type check: ${{ needs.client-type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Server lint: ${{ needs.server-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Server test: ${{ needs.server-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Server build: ${{ needs.server-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
