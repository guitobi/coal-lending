name: Deploy client to Vercel

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: vercel-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Only deploy if CI passed or if manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run linting
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://coal-lending-backend.fly.dev
          VITE_SITE_URL: https://vanshare.pl
          VITE_GA_MEASUREMENT_ID: G-TY2RQHRFWQ

      - name: Check bundle size
        working-directory: client
        run: npm run perf-budget || echo "Bundle size check completed"
        continue-on-error: true

      - name: Generate sitemap and robots
        working-directory: client
        run: |
          echo "Sitemap and robots.txt already generated during build"
          ls -lh dist/sitemap.xml dist/robots.txt || echo "Files not found"

      - name: Deploy to Vercel
        working-directory: client
        run: |
          npm install -g vercel
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 15
          curl -f https://vanshare.pl || echo "Site check failed, but deployment may still be in progress"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "🔗 URL: https://vanshare.pl" >> $GITHUB_STEP_SUMMARY
          echo "📦 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 Deployed by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: 20.x" >> $GITHUB_STEP_SUMMARY
          echo "- React: 19.2" >> $GITHUB_STEP_SUMMARY
          echo "- Vite: 7.2" >> $GITHUB_STEP_SUMMARY
