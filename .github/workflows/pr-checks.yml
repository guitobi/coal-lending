name: PR - Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - prod
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================
  # PR METADATA
  # ============================================
  pr-info:
    name: PR - Information
    runs-on: ubuntu-latest

    steps:
      - name: PR Details
        run: |
          echo "## Pull Request Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Branch:** ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Head Branch:** ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changed Files:** ${{ github.event.pull_request.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +${{ github.event.pull_request.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -${{ github.event.pull_request.deletions }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # CHANGED FILES DETECTION
  # ============================================
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
            workflows:
              - '.github/workflows/**'

  # ============================================
  # CLIENT CHECKS (only if client changed)
  # ============================================
  client-checks:
    name: Client - Full Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://coal-lending-backend.fly.dev
          VITE_SITE_URL: https://vanshare.pl
          VITE_GA_MEASUREMENT_ID: G-TY2RQHRFWQ

      - name: Analyze bundle size
        working-directory: client
        run: npm run analyze || echo "Bundle analysis completed"
        continue-on-error: true

      - name: Check performance budget
        working-directory: client
        run: npm run perf-budget || echo "Performance budget check completed"
        continue-on-error: true

      - name: Comment PR with build info
        if: always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const distPath = 'client/dist';

            let comment = '## 📦 Client Build Summary\n\n';
            comment += '✅ Build completed successfully\n\n';
            comment += '### Bundle Information\n';
            comment += '- Build tool: Vite 7.2\n';
            comment += '- React version: 19.2\n';
            comment += '- Output directory: `client/dist`\n\n';
            comment += '> Bundle size analysis available in workflow logs\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # SERVER CHECKS (only if server changed)
  # ============================================
  server-checks:
    name: Server - Full Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: |
          if grep -q '"test"' package.json && ! grep -q '"test": "echo \\"Error: no test specified\\"' package.json; then
            npm test
          else
            echo "⏭️ No tests configured - skipping"
          fi

      - name: Build Docker image
        working-directory: server
        run: docker build -t coal-lending-server:pr-${{ github.event.pull_request.number }} .

      - name: Test Docker container
        run: |
          docker run -d --name test-server \
            -e NODE_ENV=test \
            -e PORT=5000 \
            -e FRONTEND_URL=http://localhost:5173 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e RESEND_API_KEY=test_key \
            -e MAIL_FROM=test@example.com \
            -e EMAIL_TO=test@example.com \
            -e CONTACT_EMAIL_TO=test@example.com \
            -e ADMIN_API_KEY=test_admin_key \
            -p 5000:5000 \
            coal-lending-server:pr-${{ github.event.pull_request.number }}

          sleep 5

          if docker ps | grep test-server; then
            echo "✅ Container started successfully"
          else
            echo "❌ Container failed to start"
            docker logs test-server
            exit 1
          fi

          curl -f http://localhost:5000/health || exit 1
          echo "✅ Health check passed"

          docker stop test-server
          docker rm test-server

      - name: Comment PR with server info
        uses: actions/github-script@v7
        with:
          script: |
            const comment = '## 🚀 Server Build Summary\n\n' +
              '✅ Server build completed successfully\n\n' +
              '### Docker Image\n' +
              '- Base image: node:20-alpine\n' +
              '- Health check: ✅ Passed\n' +
              '- Container test: ✅ Passed\n\n' +
              '### API Endpoints\n' +
              '- `POST /api/order/new` - Create order\n' +
              '- `POST /api/problem/new` - Contact form\n' +
              '- `POST /api/heatmap/*` - Analytics\n' +
              '- `GET /health` - Health check\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # SECURITY SCAN
  # ============================================
  security-scan:
    name: Security - Vulnerability Scan
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit client dependencies
        if: needs.detect-changes.outputs.client == 'true'
        working-directory: client
        run: |
          npm audit --audit-level=moderate --json > client-audit.json || true
          cat client-audit.json

      - name: Audit server dependencies
        if: needs.detect-changes.outputs.server == 'true'
        working-directory: server
        run: |
          npm audit --audit-level=moderate --json > server-audit.json || true
          cat server-audit.json

      - name: Comment security findings
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## 🔒 Security Audit\n\n';
            comment += 'Dependency vulnerability scan completed.\n\n';
            comment += '> Check workflow logs for detailed audit results\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # PR SUMMARY
  # ============================================
  pr-summary:
    name: PR - Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, client-checks, server-checks, security-scan]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## ✅ PR Quality Checks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Components" >> $GITHUB_STEP_SUMMARY
          echo "- Client: ${{ needs.detect-changes.outputs.client == 'true' && '✅ Changed' || '⏭️ No changes' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Server: ${{ needs.detect-changes.outputs.server == 'true' && '✅ Changed' || '⏭️ No changes' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflows: ${{ needs.detect-changes.outputs.workflows == 'true' && '✅ Changed' || '⏭️ No changes' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- Client checks: ${{ needs.client-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Server checks: ${{ needs.server-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Check if all required checks passed
        run: |
          client_result="${{ needs.client-checks.result }}"
          server_result="${{ needs.server-checks.result }}"

          # Skip if not applicable
          if [ "$client_result" = "skipped" ]; then client_result="success"; fi
          if [ "$server_result" = "skipped" ]; then server_result="success"; fi

          if [ "$client_result" != "success" ] || [ "$server_result" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          echo "✅ All checks passed - PR is ready for review!"
