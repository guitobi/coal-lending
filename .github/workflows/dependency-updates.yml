name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check client outdated packages
        working-directory: client
        run: |
          echo "## Client Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm outdated >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check server outdated packages
        working-directory: server
        run: |
          echo "## Server Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm outdated >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Audit client dependencies
        working-directory: client
        run: |
          echo "## Client Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true

      - name: Audit server dependencies
        working-directory: server
        run: |
          echo "## Server Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true

      - name: Save audit results
        id: audit_results
        run: |
          # Check if there are any outdated packages or vulnerabilities
          cd client
          CLIENT_OUTDATED=$(npm outdated 2>&1 || true)
          cd ../server
          SERVER_OUTDATED=$(npm outdated 2>&1 || true)

          if [ -n "$CLIENT_OUTDATED" ] || [ -n "$SERVER_OUTDATED" ]; then
            echo "has_findings=true" >> $GITHUB_OUTPUT
          else
            echo "has_findings=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if findings exist
        if: steps.audit_results.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Weekly Dependency Update Check - ' + new Date().toISOString().split('T')[0];
            const body = `## Dependency Update Report

            This is an automated weekly check for outdated packages and security vulnerabilities.

            ### Actions Required:
            1. Review outdated packages in workflow summary
            2. Check security audit results
            3. Update dependencies if needed
            4. Test thoroughly after updates

            ### How to Update:
            \`\`\`bash
            # Client
            cd client
            npm update
            npm audit fix

            # Server
            cd server
            npm update
            npm audit fix
            \`\`\`

            ### Links:
            - [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [npm audit documentation](https://docs.npmjs.com/cli/v8/commands/npm-audit)

            ---
            *This issue was automatically created by the Dependency Updates workflow*
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Weekly Dependency Update Check')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies', 'automated']
              });
            }
